services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  citizen:
    build: ./apps/citizen
    ports:
      - "3000:3000"
    env_file:
      - ./apps/citizen/.env.local
    volumes:
      - ./apps/citizen:/app
      - /app/node_modules
    command: npm run dev

  # Admin console lives inside the citizen app at /admin (single login,
  # single port 3000). No separate admin service needed.
